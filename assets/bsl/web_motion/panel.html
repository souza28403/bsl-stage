<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Motion Studio</title>
<!-- Painel remoto do BSL WebMotion (porta 8082 no plugin). Mesmo layout do painel embutido no plugin FFGL; as tres rotas
     /api/action?cmd=text|logo|clear agora funcionam (o plugin respondia not_found). -->
<style>
  body { margin: 0; background: #0f1115; color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; text-align: center; }
  h1 { color: #ff007f; padding: 20px; margin: 0; background: #161a22; border-bottom: 2px solid #333; font-size: 24px; text-transform: uppercase; }
  .container { padding: 20px; max-width: 600px; margin: 0 auto; text-align: left; }
  label { font-size: 14px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; display: block; font-weight: bold; }
  input, select { width: 100%; box-sizing: border-box; padding: 18px; margin-bottom: 25px; border-radius: 8px; border: 1px solid #444; background: #1a1e26; color: white; font-size: 16px; outline: none; transition: border 0.3s; }
  input:focus, select:focus { border-color: #ff007f; }
  .btn { display: block; width: 100%; padding: 20px; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; font-weight: bold; background: #00f3ff; color: #000; text-transform: uppercase; margin-bottom: 15px; transition: 0.2s; box-shadow: 0 4px 15px rgba(0,243,255,0.3); }
  .btn:active { transform: scale(0.98); }
  .btn-logo { background: #ff007f; color: white; box-shadow: 0 4px 15px rgba(255,0,127,0.3); }
  .btn-clear { background: #222; color: #fff; border: 1px solid #555; box-shadow: none; }
  .btn-clear:active { background: #111; }
  #screen { width: 100%; border-radius: 8px; background: #000; margin-bottom: 20px; min-height: 120px; }
</style>
</head>
<body>
  <h1>MOTION STUDIO</h1>
  <div class="container">
      <img id="screen" alt="Saída ao vivo">

      <label>TEXTO ANIMADO (AVISOS / LETRAS)</label>
      <input type="text" id="txtInput" placeholder="Ex: Célula de Jovens..." />
      <select id="txtAnim">
          <option value="slide">Animação: Slide UP</option>
          <option value="zoom">Animação: Zoom IN</option>
      </select>
      <button class="btn" onclick="sendText()">Projetar Texto</button>

      <div style="height: 10px;"></div>

      <label>LOGO (URL DA IMAGEM)</label>
      <input type="text" id="logoInput" placeholder="https://exemplo.com/logo-branca.png" />
      <button class="btn btn-logo" onclick="sendLogo()">Projetar Logo</button>

      <div style="height: 30px;"></div>
      <button class="btn btn-clear" onclick="clearAll()">APAGAR TELA (FADE OUT)</button>
  </div>
  <script>
    function sendText() {
        var txt = encodeURIComponent(document.getElementById('txtInput').value);
        var anim = document.getElementById('txtAnim').value;
        fetch('/api/action?cmd=text&val=' + txt + '&anim=' + anim);
    }
    function sendLogo() {
        var url = encodeURIComponent(document.getElementById('logoInput').value);
        fetch('/api/action?cmd=logo&val=' + url);
    }
    function clearAll() {
        fetch('/api/action?cmd=clear');
    }
    // Previa ao vivo (JPEG, ~5 quadros por segundo)
    (function preview() {
        var img = document.getElementById('screen');
        function next() { setTimeout(function () { img.src = '/api/screen?t=' + Date.now(); }, 200); }
        img.onload = next;
        img.onerror = function () { setTimeout(next, 800); };
        img.src = '/api/screen?t=' + Date.now();
    })();
  </script>
</body>
</html>
